<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskTracker - Login</title>
  <!-- Bootstrap 5 CDN (No custom CSS) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-md-6 col-lg-4">
        
        <div class="text-center mb-4">
          <div class="display-6 fw-bold text-primary">TaskTracker</div>
          <p class="text-secondary small">Demo Application & Antigravity Platform</p>
        </div>

        <div class="card shadow-sm border-0">
          <div class="card-body p-4">
            <h5 class="card-title fw-semibold mb-3 text-center">Sign In</h5>

            <div id="alertBox" class="alert alert-danger d-none" role="alert"></div>

            <form id="loginForm">
              <div class="mb-3">
                <label for="usernameInput" class="form-label small fw-semibold">Username</label>
                <input type="text" class="form-control" id="usernameInput" placeholder="e.g. admin" required autofocus>
              </div>

              <div class="mb-3">
                <label for="passwordInput" class="form-label small fw-semibold">Password</label>
                <input type="password" class="form-control" id="passwordInput" placeholder="e.g. password123" required>
              </div>

              <div class="d-grid mb-3">
                <button type="submit" id="submitBtn" class="btn btn-primary fw-semibold">
                  <span id="btnSpinner" class="spinner-border spinner-border-sm d-none me-1" role="status" aria-hidden="true"></span>
                  Sign In with JWT
                </button>
              </div>
            </form>

            <div class="border-top pt-3 mt-3 text-center">
              <div class="badge bg-light text-dark border p-2 w-100 text-start">
                <div class="fw-bold mb-1">Demo Credentials (.env):</div>
                <div>Username: <code class="fw-semibold">admin</code></div>
                <div>Password: <code class="fw-semibold">password123</code></div>
                <div class="mt-1 text-muted small">API Key access is also supported via <code>X-API-Key</code> header.</div>
              </div>
            </div>
          </div>
        </div>

        <div class="text-center text-muted small mt-4">
          TaskTracker App &bull; Powered by Flask, FastMCP & Antigravity
        </div>

      </div>
    </div>
  </div>

  <!-- Bootstrap 5 Bundle JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

  <!-- Plain JavaScript / Fetch Logic -->
  <script>
    // If token already exists, verify and redirect to dashboard
    const existingToken = localStorage.getItem("tasktracker_jwt_token");
    if (existingToken) {
      fetch("/api/auth/me", {
        headers: { "Authorization": "Bearer " + existingToken }
      })
      .then(res => {
        if (res.ok) window.location.href = "/";
        else localStorage.removeItem("tasktracker_jwt_token");
      })
      .catch(() => localStorage.removeItem("tasktracker_jwt_token"));
    }

    const form = document.getElementById("loginForm");
    const alertBox = document.getElementById("alertBox");
    const submitBtn = document.getElementById("submitBtn");
    const btnSpinner = document.getElementById("btnSpinner");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      alertBox.classList.add("d-none");
      alertBox.textContent = "";
      submitBtn.disabled = true;
      btnSpinner.classList.remove("d-none");

      const username = document.getElementById("usernameInput").value.trim();
      const password = document.getElementById("passwordInput").value.trim();

      try {
        const response = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (response.ok && data.token) {
          localStorage.setItem("tasktracker_jwt_token", data.token);
          localStorage.setItem("tasktracker_user", JSON.stringify(data.user));
          window.location.href = "/";
        } else {
          alertBox.textContent = data.error || "Authentication failed. Please check your credentials.";
          alertBox.classList.remove("d-none");
        }
      } catch (err) {
        alertBox.textContent = "Network error while connecting to server: " + err.message;
        alertBox.classList.remove("d-none");
      } finally {
        submitBtn.disabled = false;
        btnSpinner.classList.add("d-none");
      }
    });
  </script>
</body>
</html>
